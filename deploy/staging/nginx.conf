log_format jev_safe '$request_method $uri $status $body_bytes_sent $request_time';
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Never log OAuth codes/state, cookies, Authorization or referrers.
  access_log /var/log/nginx/access.log jev_safe;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /api/auth/login {
    proxy_pass http://api:3001/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location = /api/integrations/github/callback {
    proxy_pass http://api:3001/integrations/github/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # Nginx error logs include the original query even with a safe access format.
    # Safe access status/timing and sanitized API audit remain available.
    error_log /dev/null;
  }
  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}

