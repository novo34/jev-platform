name: platform-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jev_test
          POSTGRES_USER: jev
          POSTGRES_PASSWORD: jev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jev -d jev_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jev:jev@127.0.0.1:5432/jev_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Install lockfile-pinned production verifier dependencies
        run: npm ci --ignore-scripts --prefix scripts

      - name: Check
        run: npm run check

      - name: Verify restricted production-mode API and Worker on PostgreSQL 16
        env:
          JEV_DB_SMOKE: "1"
        run: npm run smoke:restricted-runtime

      - name: Smoke local development
        shell: bash
        run: |
          npm run dev > /tmp/jev-dev.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null               && curl --fail --silent http://127.0.0.1:3001/health >/dev/null               && curl --fail --silent http://127.0.0.1:3002/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/jev-dev.log
            exit 1
          fi

  staging-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate isolated Dokploy staging Compose
        env:
          JEV_STAGING_RUNTIME_DATABASE_URL: postgresql://jev_runtime:placeholder@postgres:5432/jev_staging
          JEV_STAGING_RUNTIME_DB_PASSWORD: placeholder
          JEV_STAGING_DB_OWNER_PASSWORD: not-a-real-secret
          JEV_STAGING_DB_BOOTSTRAP_PASSWORD: not-a-real-secret
          JEV_STAGING_ENCRYPTION_KEY: not-a-real-secret
          JEV_STAGING_ADMIN_PASSWORD: not-a-real-secret-placeholder
        run: |
          docker compose -f docker-compose.staging.yml config --quiet
          if docker compose -f docker-compose.staging.yml config --format json | jq -e '[.services | to_entries[] | select(.value.ports != null)] | length == 0' >/dev/null; then
            echo 'No public host ports in staging compose'
          else
            echo 'Unexpected published port in staging compose' >&2
            exit 1
          fi


  staging-image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build actual staging API image with pinned dependencies
        run: docker build -f deploy/staging/Dockerfile.runtime -t jev-staging-api-test .
      - name: Build actual staging web image
        run: docker build -f deploy/staging/Dockerfile.web -t jev-staging-web-test .
      - name: Check nginx proxy syntax
        run: docker run --rm --add-host api:127.0.0.1 jev-staging-web-test nginx -t
