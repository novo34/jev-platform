services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jev
      POSTGRES_USER: jev
      POSTGRES_PASSWORD: jev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jev -d jev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - jev-postgres-data:/var/lib/postgresql/data

volumes:
  jev-postgres-data:
